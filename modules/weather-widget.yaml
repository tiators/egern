name: 天气
description: 查看指定地区的当前天气、小时趋势及五天预报。
icon: cloud.sun.fill
env_schema:
  REGION:
    name: 天气地区
    description: 必填完整市区名；示例只作提示，不会自动生效。
    default_value: 杭州市西湖区
  TITLE:
    name: 显示名称
    description: 可选；留空使用地理编码返回的地区名称。
  REFRESH_MINUTES:
    name: 目标刷新间隔（分钟）
    description: 默认 30 分钟；实际刷新由 iOS 调度。
    default_value: "30"
    options: ["15", "30", "60"]
scriptings:
  - generic:
      name: weather
      script_url: https://raw.githubusercontent.com/tiators/egern/refs/heads/main/scripts/weather-widget.js
      timeout: 30
widgets:
  - name: 天气
    script_name: weather
