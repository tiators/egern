name: Weather
description: Current weather, hourly outlook and a five-day forecast for your region.
icon: cloud.sun.fill
env_schema:
  REGION:
    name: Weather region
    description: Enter the full city and district name.
    default_value: Xihu District, Hangzhou
  TITLE:
    name: Display name
    description: Optional. Leave blank to use the name returned by geocoding.
  REFRESH_MINUTES:
    name: Refresh interval (minutes)
    description: Defaults to 30 minutes. Actual refresh timing is controlled by iOS.
    default_value: "30"
    options: ["15", "30", "60"]
scriptings:
  - generic:
      name: weather
      script_url: https://raw.githubusercontent.com/tiators/egern/refs/heads/main/scripts/weather-widget.js
      timeout: 30
widgets:
  - name: Weather
    script_name: weather
